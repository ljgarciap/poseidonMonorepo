# Entorno local de Poseidon. Solo para desarrollo: credenciales NO sensibles.
services:
  postgres:
    image: postgres:16
    container_name: poseidon-postgres
    environment:
      POSTGRES_USER: poseidon_owner   # dueño del esquema; superusuario SOLO dentro del contenedor local
      POSTGRES_PASSWORD: poseidon_owner_dev
      POSTGRES_DB: poseidon
    ports:
      - "5433:5432"                   # 5433 para no chocar con un Postgres local
    volumes:
      - poseidon-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poseidon_owner -d poseidon"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  poseidon-pgdata:
